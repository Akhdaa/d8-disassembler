name: Build D8 Linux

on:
  workflow_dispatch:
    inputs:
      v8_branch:
        description: 'V8 Version / Branch'
        required: true
        default: '11.8.172.18'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      V8_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.v8_branch || '11.8.172.18' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip curl wget lsb-release sudo file pkg-config build-essential

      - name: Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          # Bootstrap: python3_bin_reldir.txt dibuat saat pertama kali invoke depot_tools
          $HOME/depot_tools/gclient --version 2>&1 | head -5 || true
          ls $HOME/depot_tools/python3_bin_reldir.txt && cat $HOME/depot_tools/python3_bin_reldir.txt && ls $HOME/depot_tools/$(cat $HOME/depot_tools/python3_bin_reldir.txt)/python3 | head
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          echo "DEPOT_TOOLS_UPDATE=0" >> $GITHUB_ENV

      - name: Fetch V8
        run: |
          export PATH="/home/runner/depot_tools:$PATH"
          which fetch gclient gn ninja
          mkdir -p target && cd target
          fetch v8 2>&1 | tail -30
          cd v8
          git checkout $V8_BRANCH 2>&1 | tail -3
          gclient sync --nohooks -v 2>&1 | tail -30
          gclient runhooks 2>&1 | tail -20

      - name: Patch V8
        run: |
          export PATH="/home/runner/depot_tools:/usr/local/bin:/usr/bin:/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y powershell 2>/dev/null || {
            wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -O /tmp/pm.deb
            sudo dpkg -i /tmp/pm.deb
            sudo apt-get update && sudo apt-get install -y powershell
          }
          pwsh ./patcher.ps1

      - name: Build D8
        id: build
        run: |
          export PATH="/home/runner/depot_tools:/usr/local/bin:/usr/bin:/bin:$PATH"
          cd target/v8
          mkdir -p out.gn/x64.release
          cat > out.gn/x64.release/args.gn <<'EOF'
          is_debug = false
          target_cpu = "x64"
          v8_monolithic = false
          v8_use_external_startup_data = true
          v8_static_library = true
          v8_enable_disassembler = true
          v8_enable_object_print = true
          v8_enable_sandbox = true
          v8_enable_pointer_compression = true
          v8_enable_pointer_compression_shared_cage = true
          v8_enable_external_code_space = true
          is_clang = true
          use_custom_libcxx = false
          treat_warnings_as_errors = false
          symbol_level = 0
          v8_enable_sandbox = false
          dcheck_always_on = false
          EOF
          gn gen out.gn/x64.release
          ninja -C out.gn/x64.release d8
          echo "artifact=d8-with-disassembler-${V8_BRANCH}-linux" >> $GITHUB_OUTPUT

      - name: Cleanup
        run: |
          cd target/v8/out.gn/x64.release
          rm -rf gen obj 2>/dev/null || true
          rm -f *.ninja_* build.ninja.d 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}-linux
          path: target/v8/out.gn/x64.release
          compression-level: 9

      # Load .jsc & dump bytecode disassembly per file
      - name: Disassemble JSCs
        run: |
          cd target/v8/out.gn/x64.release
          mkdir -p disasm
          for f in preload main server; do
            if [ -f "$GITHUB_WORKSPACE/$f.jsc" ]; then
              timeout 60 ./d8 --no-lazy --no-flush-bytecode --snapshot_blob snapshot_blob.bin \
                -e "loadBytecode('$GITHUB_WORKSPACE/$f.jsc')" > "disasm/$f.disasm.txt" 2>&1
              echo "$f done: $(wc -l < disasm/$f.disasm.txt) lines"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: disassembly-${{ env.V8_BRANCH }}
          path: target/v8/out.gn/x64.release/disasm
          compression-level: 0
