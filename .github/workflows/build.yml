name: Build D8

on:
  workflow_dispatch:
    inputs:
      v8_branch:
        description: 'V8 Version / Branch'
        required: true
        default: '11.8.172.18'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    env:
      V8_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.v8_branch || '11.8.172.18' }}
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch V8
        run: |
          mkdir target
          cd target
          fetch v8
          cd v8
          git checkout $env:V8_BRANCH
          gclient sync -v

      - name: Patch V8
        run: |
          ./patcher.ps1

      - name: Stub vs_toolchain.py for VS2026
        shell: python
        run: |
          stub = r'''
          import os, sys
          def DetectVisualStudioPath():
              return r"C:/Program Files/Microsoft Visual Studio/18/Enterprise"
          def GetVisualStudioVersion():
              return "2026"
          def GetToolchainDir(argv):
              print(r"C:/Program Files/Microsoft Visual Studio/18/Enterprise")
              return 0
          def GetVsVersion():
              print("2026")
          def CopyDlls(*a, **kw):
              pass
          def NormalizePath(p):
              return p
          def SetEnvironmentAndGetRuntimeDllDirs():
              return (r"C:/Program Files/Microsoft Visual Studio/18/Enterprise",
                      [r"C:/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Redist/MSVC/14.50.35717/x64/Microsoft.VC143.CRT"],
                      "x64")
          def SetEnvironmentAndGetSDKDir():
              return r"C:/Program Files (x86)/Windows Kits/10"
          def GetVisualStudioVersionNumber():
              return "18.0"
          def GetPathOverrides():
              return {}
          def main():
              cmd = sys.argv[1] if len(sys.argv) > 1 else ""
              args = sys.argv[2:]
              if cmd == "get_toolchain_dir":
                  # gni calls exec_script with "scope" -> output must be valid GN scope: key = value
                  print('visual_studio_path = "C:/Program Files/Microsoft Visual Studio/18/Enterprise"')
                  print('visual_studio_version = "2026"')
                  print('wdk_path = ""')
                  print('windows_sdk_path = "C:/Program Files (x86)/Windows Kits/10"')
              elif cmd == "copy_dlls":
                  pass
              return 0
          if __name__ == "__main__":
              sys.exit(main())
          '''
          import textwrap
          stub = textwrap.dedent(stub).lstrip() if hasattr(stub, "strip") else stub.lstrip('\n')
          open(r'target/v8/build/vs_toolchain.py', 'w', encoding='utf-8', newline='\n').write(stub)
          print(open(r'target/v8/build/vs_toolchain.py').read())

      - name: Build D8
        id: build
        run: |
          cd target\v8
          $release = "out.gn\x64.release"
          mkdir $release
          cp "..\..\scripts\args.gn" "$release\args.gn" -Force
          gn gen $release
          ninja -C $release d8
          $artifact = "d8-with-disassembler-$env:V8_BRANCH"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact=$artifact"

      - name: Cleanup Artifact
        run: |
          Set-Location target\v8\out.gn\x64.release
          Get-ChildItem
          Remove-Item -Path gen -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path obj -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: target/v8/out.gn/x64.release
          compression-level: 9
