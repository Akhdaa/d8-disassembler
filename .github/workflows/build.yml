name: Build D8 Linux

on:
  workflow_dispatch:
    inputs:
      v8_branch:
        description: 'V8 Version / Branch'
        required: true
        default: '11.8.172.18'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      V8_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.v8_branch || '11.8.172.18' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip curl wget lsb-release sudo file pkg-config build-essential

      - name: Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          $HOME/depot_tools/gclient --version 2>&1 | head -5 || true
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          echo "DEPOT_TOOLS_UPDATE=0" >> $GITHUB_ENV

      - name: Cache V8 source + d8 build
        uses: actions/cache@v4
        with:
          path: |
            target/v8/src
            target/v8/out.gn
            target/v8/buildtools
            target/v8/third_party
            target/v8/build
            target/v8/tools
            target/v8/include
            target/v8/test
          key: v8-${{ env.V8_BRANCH }}-v2
          restore-keys: |
            v8-${{ env.V8_BRANCH }}-

      - name: Fetch V8
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="/home/runner/depot_tools:$PATH"
          which fetch gclient gn ninja
          mkdir -p target && cd target
          fetch v8 2>&1 | tail -30
          cd v8
          git checkout $V8_BRANCH 2>&1 | tail -3
          gclient sync --nohooks -v 2>&1 | tail -30
          gclient runhooks 2>&1 | tail -20

      - name: Patch V8
        run: |
          export PATH="/home/runner/depot_tools:/usr/local/bin:/usr/bin:/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y powershell 2>/dev/null || {
            wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -O /tmp/pm.deb
            sudo dpkg -i /tmp/pm.deb
            sudo apt-get update && sudo apt-get install -y powershell
          }
          pwsh ./patcher.ps1

      - name: Build D8
        id: build
        run: |
          export PATH="/home/runner/depot_tools:/usr/local/bin:/usr/bin:/bin:$PATH"
          cd target/v8
          mkdir -p out.gn/x64.release
          if [ ! -f out.gn/x64.release/d8 ]; then
          {
            echo 'is_debug = false'
            echo 'target_cpu = "x64"'
            echo 'v8_monolithic = false'
            echo 'v8_use_external_startup_data = true'
            echo 'v8_static_library = true'
            echo 'v8_enable_disassembler = true'
            echo 'v8_enable_object_print = true'
            echo 'v8_enable_sandbox = false'
            echo 'v8_enable_pointer_compression = true'
            echo 'v8_enable_pointer_compression_shared_cage = true'
            echo 'v8_enable_external_code_space = true'
            echo 'is_clang = true'
            echo 'use_custom_libcxx = false'
            echo 'treat_warnings_as_errors = false'
            echo 'symbol_level = 0'
            echo 'dcheck_always_on = false'
          } > out.gn/x64.release/args.gn
          gn gen out.gn/x64.release
          fi
          ninja -C out.gn/x64.release d8
          echo "artifact=d8-with-disassembler-${V8_BRANCH}" >> $GITHUB_OUTPUT

      - name: Prune for artifact
        run: |
          cd target/v8/out.gn/x64.release
          rm -rf gen obj 2>/dev/null || true
          rm -f *.ninja_* build.ninja.d 2>/dev/null || true
          ls -la d8 snapshot_blob.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}-linux
          path: target/v8/out.gn/x64.release
          compression-level: 9
          if-no-files-found: error

  disasm:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jsc_file: [preload, main, server]
    env:
      V8_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.v8_branch || '11.8.172.18' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: d8-with-disassembler-${{ env.V8_BRANCH }}-linux
          path: d8-bin

      - name: Allow execute
        run: chmod +x d8-bin/d8

      - name: Run disasm on ${{ matrix.jsc_file }}
        run: |
          set +e
          cd d8-bin
          ls -la d8 snapshot_blob.bin
          SRC="$GITHUB_WORKSPACE/${{ matrix.jsc_file }}.jsc"
          ls -la "$SRC"
          mkdir -p ../out
          timeout 300 ./d8 --no-lazy --no-flush-bytecode \
            -e "loadBytecode('$SRC')" > "../out/${{ matrix.jsc_file }}.disasm.txt" 2>&1
          echo "exit=$? lines=$(wc -l < ../out/${{ matrix.jsc_file }}.disasm.txt)"
          head -20 "../out/${{ matrix.jsc_file }}.disasm.txt"
          tail -20 "../out/${{ matrix.jsc_file }}.disasm.txt"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disasm-${{ env.V8_BRANCH }}-${{ matrix.jsc_file }}
          path: out
          compression-level: 0
